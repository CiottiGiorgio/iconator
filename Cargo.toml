[package]
name = "iconator"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
blake3 = "1.8.7"
fst = "0.4.7"
lazy_static = "1.5.0"
moka = { version = "0.12.16", features = ["future"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "fs"] }

[build-dependencies]
fst = "0.4.7"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
